name: Audit member tools pricing and homepage

on:
  push:
    branches:
      - fix/member-tools-pricing-homepage-alignment
    paths:
      - '.github/workflows/audit-member-surface.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show matching files and relevant source
        shell: bash
        run: |
          echo '=== MATCHING FILES ==='
          rg -l -i 'notar|grandfather|founder|annual|yearly|requireFeature|featureGroups' apps/web-members | sort || true
          echo '=== TOOLS TREE ==='
          find apps/web-members/app -path '*tools*' -type f -maxdepth 8 -print | sort || true
          echo '=== NOTARY SOURCE ==='
          rg -n -i -C 5 'notar' apps/web-members/app apps/web-members/components apps/web-members/lib 2>/dev/null || true
          echo '=== PRICING SOURCE ==='
          rg -n -i -C 7 'grandfather|founder|annual|yearly' apps/web-members/app apps/web-members/components apps/web-members/lib 2>/dev/null || true
          echo '=== TOOL ACCESS SOURCE ==='
          rg -n -i -C 7 'requireFeature|featureGroups|entitlement|subscription_tier|tools' apps/web-members/app/tools apps/web-members/lib apps/web-members/middleware.ts 2>/dev/null || true
