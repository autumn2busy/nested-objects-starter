""", encoding='utf-8')

          # 2. De-center notary language only from the root homepage import graph.
          app_root = web / 'app'
          component_root = web / 'components'
          home_entry = app_root / 'page.tsx'
          if not home_entry.exists():
              raise SystemExit('Missing apps/web-members/app/page.tsx')

          import_pattern = re.compile(r"from\s+['\"]([^'\"]+)['\"]")
          extensions = ['', '.tsx', '.ts', '/index.tsx', '/index.ts']
          reachable = set()
          queue = [home_entry]

          def resolve_import(source_path: Path, specifier: str):
              if specifier.startswith('@/'):
                  base = web / specifier[2:]
              elif specifier.startswith('.'):
                  base = source_path.parent / specifier
              else:
                  return None
              for suffix in extensions:
                  candidate = Path(str(base) + suffix).resolve()
                  try:
                      candidate.relative_to(web.resolve())
                  except ValueError:
                      continue
                  if candidate.is_file():
                      return candidate
              return None

          while queue:
              current = queue.pop()
              current = current.resolve()
              if current in reachable or not current.is_file():
                  continue
              reachable.add(current)
              source = current.read_text(encoding='utf-8')
              for specifier in import_pattern.findall(source):
                  resolved = resolve_import(current, specifier)
                  if resolved and resolved not in reachable:
                      queue.append(resolved)

          phrase_replacements = [
              (re.compile(r'Notaries\s*[&+]\s*Field Inspectors', re.I), 'Field Inspectors'),
              (re.compile(r'Notaries\s+and\s+Field Inspectors', re.I), 'Field Inspectors'),
              (re.compile(r'notaries\s+and\s+field inspectors', re.I), 'field inspectors'),
              (re.compile(r'notary\s+and\s+field inspection professionals', re.I), 'field inspection professionals'),
              (re.compile(r'notary professionals', re.I), 'field inspection professionals'),
              (re.compile(r'notary signing agents', re.I), 'mobile professionals entering field inspection'),
              (re.compile(r'\bNotaries\b'), 'Field Inspectors'),
              (re.compile(r'\bnotaries\b'), 'field inspectors'),
              (re.compile(r'\bNotary\b'), 'Field Inspection'),
              (re.compile(r'\bnotary\b'), 'field inspection'),
          ]

          changed_home_files = []
          for path in sorted(reachable):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              source = path.read_text(encoding='utf-8')
              if not re.search(r'notar', source, re.I):
                  continue
              updated = source
              for pattern, replacement in phrase_replacements:
                  updated = pattern.sub(replacement, updated)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed_home_files.append(path)

          if not changed_home_files:
              raise SystemExit('No notary-centered copy was found in the root homepage import graph')

          # 3. Hide legacy or grandfathered plans at the public pricing render boundary.
          pricing_entries = list(app_root.glob('**/pricing/page.tsx'))
          if not pricing_entries:
              raise SystemExit('No public pricing page was found')

          pricing_reachable = set()
          queue = pricing_entries[:]
          while queue:
              current = queue.pop().resolve()
              if current in pricing_reachable or not current.is_file():
                  continue
              pricing_reachable.add(current)
              source = current.read_text(encoding='utf-8')
              for specifier in import_pattern.findall(source):
                  resolved = resolve_import(current, specifier)
                  if resolved and resolved not in pricing_reachable:
                      queue.append(resolved)

          helper = """const isPubliclyPurchasablePlan = (plan: unknown): boolean =>
  !/\\b(founder|grandfather)\\b/i.test(JSON.stringify(plan))

"""
          patched_pricing_files = []
          map_pattern = re.compile(
              r'(?P<expr>\b[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*|\[[^\]\n]+\])*)\.map\((?P<callback>\s*\(?\s*(?P<param>plan|tier)\s*\)?\s*=>)',
          )

          for path in sorted(pricing_reachable):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              source = path.read_text(encoding='utf-8')
              if 'isPubliclyPurchasablePlan' in source:
                  continue

              replacements = 0
              def add_filter(match):
                  nonlocal_replacements[0] += 1
                  return f"{match.group('expr')}.filter(isPubliclyPurchasablePlan).map({match.group('callback')}"

              nonlocal_replacements = [0]
              updated = map_pattern.sub(add_filter, source)
              replacements = nonlocal_replacements[0]
              if replacements == 0:
                  continue

              # Insert the helper after the import block.
              import_matches = list(re.finditer(r"^import[^\n]*(?:\n|$)", updated, re.M))
              if import_matches:
                  insertion = import_matches[-1].end()
                  updated = updated[:insertion] + '\n' + helper + updated[insertion:]
              else:
                  updated = helper + updated
              path.write_text(updated, encoding='utf-8')
              patched_pricing_files.append(path)

          if not patched_pricing_files:
              # Fallback for locally declared plan arrays. Remove only rendering objects in pricing-reachable files.
              def remove_legacy_object(source: str):
                  positions = [m.start() for m in re.finditer(r'founder|grandfather', source, re.I)]
                  updated = source
                  removed = 0
                  for pos in reversed(positions):
                      start = updated.rfind('{', 0, pos)
                      if start < 0:
                          continue
                      depth = 0
                      in_string = None
                      escaped = False
                      end = None
                      for index in range(start, len(updated)):
                          ch = updated[index]
                          if in_string:
                              if escaped:
                                  escaped = False
                              elif ch == '\\':
                                  escaped = True
                              elif ch == in_string:
                                  in_string = None
                              continue
                          if ch in {'\"', "'", '`'}:
                              in_string = ch
                              continue
                          if ch == '{':
                              depth += 1
                          elif ch == '}':
                              depth -= 1
                              if depth == 0:
                                  end = index + 1
                                  break
                      if end is None:
                          continue
                      block = updated[start:end]
                      if not re.search(r'\b(name|title|label|plan)\b', block, re.I):
                          continue
                      left = start
                      right = end
                      while left > 0 and updated[left - 1].isspace():
                          left -= 1
                      if left > 0 and updated[left - 1] == ',':
                          left -= 1
                      else:
                          while right < len(updated) and updated[right].isspace():
                              right += 1
                          if right < len(updated) and updated[right] == ',':
                              right += 1
                      updated = updated[:left] + updated[right:]
                      removed += 1
                  return updated, removed

              for path in sorted(pricing_reachable):
                  if path.suffix not in {'.ts', '.tsx'}:
                      continue
                  source = path.read_text(encoding='utf-8')
                  if not re.search(r'founder|grandfather', source, re.I):
                      continue
                  updated, removed = remove_legacy_object(source)
                  if removed:
                      path.write_text(updated, encoding='utf-8')
                      patched_pricing_files.append(path)

          if not patched_pricing_files:
              raise SystemExit('Could not identify a safe public pricing render boundary for legacy-plan filtering')

          # 4. Add a focused contract test that protects the product decisions.
          test_script = web / 'scripts/validate-member-public-surfaces.mjs'
          test_script.parent.mkdir(parents=True, exist_ok=True)
          test_script.write_text("""import { readFile, readdir } from 'node:fs/promises'
import path from 'node:path'
import process from 'node:process'
import { fileURLToPath } from 'node:url'

const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..')
const failures = []

const toolsSource = await readFile(path.join(root, 'app/tools/page.tsx'), 'utf8')
for (const required of ['Preview mode', 'Free members', 'Preview only. No function enabled']) {
  if (!toolsSource.includes(required)) failures.push(`Tools preview is missing: ${required}`)
}
if (/href=["'{`]\/tools\//.test(toolsSource)) {
  failures.push('Tools preview exposes a functional /tools/ link')
}
if (!toolsSource.includes('disabled') || !toolsSource.includes('aria-disabled')) {
  failures.push('Tools preview does not expose an explicit disabled state')
}

const homeEntry = await readFile(path.join(root, 'app/page.tsx'), 'utf8')
if (/notar/i.test(homeEntry)) failures.push('Root homepage entry still centers notary language')

const pricingFiles = await collect(path.join(root, 'app'))
const pricingSources = await Promise.all(
  pricingFiles.filter((file) => file.includes(`${path.sep}pricing${path.sep}`) && /\.(ts|tsx)$/.test(file)).map((file) => readFile(file, 'utf8')),
)
if (!pricingSources.some((source) => source.includes('isPubliclyPurchasablePlan') || !/founder|grandfather/i.test(source))) {
  failures.push('Public pricing does not establish a legacy-plan exclusion boundary')
}

if (failures.length) {
  console.error(failures.join('\n'))
  process.exitCode = 1
} else {
  console.log('Member public-surface contract check passed.')
}

async function collect(directory) {
  const entries = await readdir(directory, { withFileTypes: true })
  const files = []
  for (const entry of entries) {
    const absolute = path.join(directory, entry.name)
    if (entry.isDirectory()) files.push(...await collect(absolute))
    else files.push(absolute)
  }
  return files
}
""", encoding='utf-8')

          package_path = web / 'package.json'
          package_source = package_path.read_text(encoding='utf-8')
          if 'validate:member-surfaces' not in package_source:
              import json
              package = json.loads(package_source)
              scripts = package.setdefault('scripts', {})
              scripts['validate:member-surfaces'] = 'node scripts/validate-member-public-surfaces.mjs'
              package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          # Remove temporary one-shot workflows from the review branch.
          for workflow in [
              root / '.github/workflows/audit-member-surface.yml',
              root / '.github/workflows/apply-member-surface-fix.yml',
          ]:
              if workflow.exists():
                  workflow.unlink()

          print('Tools page:', tools_page)
          print('Homepage copy files:', *changed_home_files, sep='\n  ')
          print('Pricing boundary files:', *patched_pricing_files, sep='\n  ')
          PY

      - name: Install member app dependencies
        working-directory: apps/web-members
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate public surface contracts
        working-directory: apps/web-members
        run: |
          npm run validate:member-surfaces
          npm run lint

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit focused member-surface fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align tools pricing and homepage positioning"
          git push origin HEAD:fix/member-tools-pricing-homepage-alignment
