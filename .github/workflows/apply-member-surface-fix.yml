name: Apply member surface alignment

on:
  push:
    branches:
      - fix/member-tools-pricing-homepage-alignment
    paths:
      - '.github/workflows/apply-member-surface-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/member-tools-pricing-homepage-alignment
          fetch-depth: 0

      - name: Apply reviewed product-surface changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          web = root / 'apps/web-members'

