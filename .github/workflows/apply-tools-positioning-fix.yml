name: Apply tools and positioning consistency patch

on:
  push:
    branches:
      - fix/tools-entitlements-pricing-positioning
    paths:
      - '.github/workflows/apply-tools-positioning-fix.yml'

permissions:
  contents: write

jobs:
  patch-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/tools-entitlements-pricing-positioning
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply reviewed consistency changes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(source.replace(old, new, 1))

          def replace_regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              source = file.read_text()
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}: {pattern[:100]!r}")
              file.write_text(updated)

          auth_provider = 'apps/web-members/components/auth-provider.tsx'
          replace_regex_once(
              auth_provider,
              r"  // Tools .*?\n  ai_concierge:.*?\n  firm_intel:.*?\n  job_tracking:.*?\n  job_tracker:.*?\n  job_routing:.*?\n  weather_tool:.*?\n  ai_resume:.*?\n  readiness_guides:.*?\n  tools_templates:.*?\n",
              """  // Tools. Free receives one useful activation tool. Working workspace tools begin at current Pro.\n  // Legacy Starter and Founders members retain the tool access promised by their original plans.\n  income_calculator: 'L9nbKV9Z',       // Free+\n  ai_concierge: 'zWZD0rQp',            // Legacy Starter/Founders and current Pro+\n  ai_resume: 'zWZD0rQp',               // Legacy Starter/Founders and current Pro+\n  job_tracking: 'zWZD0rQp',            // Legacy Starter/Founders and current Pro+\n  job_tracker: 'zWZD0rQp',             // Legacy route alias\n  weather_tool: 'rQVqlLm6',            // Pro+\n  job_routing: 'rQVqlLm6',             // Pro+\n  notary_route_calculator: 'rQVqlLm6', // Pro+\n  firm_intel: 'rQVqlLm6',              // Pro+\n  readiness_guides: 'L9nbKV9Z',        // Free+\n  tools_templates: 'rQVqlLm6',         // Pro+\n""",
          )

          auth_server = 'apps/web-members/lib/auth-server.ts'
          replace_regex_once(
              auth_server,
              r"export const FEATURE_ACCESS: Record<string, string\[]> = \{.*?\n\}\n\n// Outseta JWKS URL",
              """export const FEATURE_ACCESS: Record<string, string[]> = {\n  directory_access: [\n    PLAN_UIDS.FREE,\n    PLAN_UIDS.STARTER,\n    PLAN_UIDS.FOUNDERS,\n    PLAN_UIDS.PRO,\n    PLAN_UIDS.ELITE,\n    PLAN_UIDS.AGENCY,\n  ],\n  income_calculator: [\n    PLAN_UIDS.FREE,\n    PLAN_UIDS.STARTER,\n    PLAN_UIDS.FOUNDERS,\n    PLAN_UIDS.PRO,\n    PLAN_UIDS.ELITE,\n    PLAN_UIDS.AGENCY,\n  ],\n  ai_chatbot: [PLAN_UIDS.STARTER, PLAN_UIDS.FOUNDERS, PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  ai_concierge: [PLAN_UIDS.STARTER, PLAN_UIDS.FOUNDERS, PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  ai_resume: [PLAN_UIDS.STARTER, PLAN_UIDS.FOUNDERS, PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  job_tracking: [PLAN_UIDS.STARTER, PLAN_UIDS.FOUNDERS, PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  job_tracker: [PLAN_UIDS.STARTER, PLAN_UIDS.FOUNDERS, PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  weather_tool: [PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  job_routing: [PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  notary_route_calculator: [PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  job_intel: [PLAN_UIDS.PRO, PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  priority_support: [PLAN_UIDS.ELITE, PLAN_UIDS.AGENCY],\n  white_label: [PLAN_UIDS.AGENCY],\n}\n\n// Outseta JWKS URL""",
          )

          plans = 'apps/web-members/lib/ai-datasets.ts'
          replace_once(
              plans,
              """    description:\n      'Perfect for checking out the ecosystem before you subscribe. You get limited directory visibility and a preview of the training and resources.',\n""",
              """    description:\n      'Explore the ecosystem before you subscribe. Free includes limited directory visibility, training and resource previews, and the income calculator after login.',\n""",
          )
          replace_once(
              plans,
              """      'Resources and readiness guides',\n      'Upgrade any time',\n""",
              """      'Resources and readiness guides',\n      'Income calculator with a Free account',\n      'Upgrade any time',\n""",
          )
          replace_once(
              plans,
              """\nexport type FirmDirectoryEntry = {\n""",
              """\nconst PUBLIC_PLAN_UIDS = new Set<string>([\n  PLAN_UIDS.FREE,\n  PLAN_UIDS.PRO,\n  PLAN_UIDS.ELITE,\n  PLAN_UIDS.AGENCY,\n])\n\nexport const publicMembershipPlans = membershipPlans.filter((plan) =>\n  PUBLIC_PLAN_UIDS.has(plan.planUid)\n)\n\nexport type FirmDirectoryEntry = {\n""",
          )

          membership_view = 'apps/web-members/app/membership-pricing/MembershipView.tsx'
          replace_once(
              membership_view,
              "import { membershipPlans } from '@/lib/ai-datasets'",
              "import { publicMembershipPlans } from '@/lib/ai-datasets'",
          )
          replace_once(
              membership_view,
              'const proPlan = membershipPlans.find((p) => p.planUid === PLAN_UIDS.PRO)!',
              'const proPlan = publicMembershipPlans.find((p) => p.planUid === PLAN_UIDS.PRO)!',
          )
          replace_once(
              membership_view,
              """                        {membershipPlans\n                            .filter((plan) => !plan.hidden)\n                            .map((plan) => {\n""",
              """                        {publicMembershipPlans.map((plan) => {\n""",
          )
          replace_once(
              membership_view,
              """                    Nested Objects is built for inspectors, notaries, real estate pros, and gig workers who\n                    want clear intel on firms, gear, and routes before they hit the road.\n""",
              """                    Nested Objects is built for independent field inspectors and adjacent property-service vendors who\n                    want clear firm intelligence, practical training, and route tools before they take on more work.\n""",
          )

          pricing_interactions = 'apps/web-members/app/membership-pricing/PricingInteractions.tsx'
          replace_once(
              pricing_interactions,
              """function getPlanPaymentTerm(plan: MembershipPlan) {\n  if (plan.period === 'forever') return undefined\n  return plan.period.includes('month') ? 'month' : 'oneTime'\n}\n""",
              """function getPlanPaymentTerm(plan: MembershipPlan) {\n  if (plan.period === 'forever') return undefined\n  if (plan.period.includes('month')) return 'month'\n  if (plan.period.includes('year')) return 'annual'\n  if (plan.period.includes('quarter')) return 'quarter'\n  return 'oneTime'\n}\n""",
          )
          replace_once(
              pricing_interactions,
              """    if (isAuthenticated) {\n      trackOutsetaModalOpen({\n""",
              """    if (isAuthenticated) {\n      // The options inside this hosted view are controlled by the active Outseta plan family.\n      // Keep Starter and Founders in the deactivated legacy family documented in the operator runbook.\n      trackOutsetaModalOpen({\n""",
          )

          homepage = 'apps/web-members/app/page.tsx'
          replace_once(
              homepage,
              "detail: 'Browse firms serving Texas inspectors, notaries, and preservation vendors.',",
              "detail: 'Browse firms serving Texas inspectors, property preservation vendors, and field-service contractors.',",
          )
          replace_once(
              homepage,
              """            \"mainEntity\": [\n              {\n                \"@type\": \"Question\",\n                \"name\": \"How do I find Independent Field Inspector work near me?\",\n                \"acceptedAnswer\": {\n                  \"@type\": \"Answer\",\n                  \"text\": \"Nested Objects connects you with national firms hiring for Mortgage Field Inspection services and Insurance Loss Control jobs in your exact zip code.\"\n                }\n              },\n              {\n                \"@type\": \"Question\",\n                \"name\": \"Can I do Mobile Notary for real estate closings?\",\n                \"acceptedAnswer\": {\n                  \"@type\": \"Answer\",\n                  \"text\": \"Yes. Our hub lists firms specifically looking for Loan Signing Agents and notaries certified for Remote Online Notarization (RON).\"\n                }\n              },\n              {\n                \"@type\": \"Question\",\n                \"name\": \"Who hires for Drive-by appraisal services?\",\n                \"acceptedAnswer\": {\n                  \"@type\": \"Answer\",\n                  \"text\": \"Lenders and AMCs hire through Nested Objects for drive-by appraisals and BPOs. Upgrade to Pro to see pay rates for these valuation orders.\"\n                }\n              }\n            ]\n""",
              """            \"mainEntity\": [\n              {\n                \"@type\": \"Question\",\n                \"name\": \"How do I find independent field inspector work near me?\",\n                \"acceptedAnswer\": {\n                  \"@type\": \"Answer\",\n                  \"text\": \"Nested Objects helps independent inspectors compare national and regional field service firms by coverage, assignment type, requirements, and application path.\"\n                }\n              },\n              {\n                \"@type\": \"Question\",\n                \"name\": \"What kinds of assignments do field inspectors complete?\",\n                \"acceptedAnswer\": {\n                  \"@type\": \"Answer\",\n                  \"text\": \"Common assignments include occupancy checks, exterior condition reports, insurance loss-control surveys, property photos, merchant site verifications, and preservation-related documentation. Requirements vary by firm and state.\"\n                }\n              },\n              {\n                \"@type\": \"Question\",\n                \"name\": \"How do I know which field inspection firms fit my route?\",\n                \"acceptedAnswer\": {\n                  \"@type\": \"Answer\",\n                  \"text\": \"Compare coverage areas, pay clues, appointment requirements, turnaround expectations, and equipment needs before applying. Pro members can view deeper firm intelligence.\"\n                }\n              }\n            ]\n""",
          )
          replace_once(
              homepage,
              """                <span>• Mortgage Field Inspection services &amp; Loss Control</span>\n                <span>• Mobile Notary for real estate closings (RON)</span>\n                <span>• Certified residential property appraisal pros</span>\n                <span>• Independent Field Inspector near me (Gig)</span>\n""",
              """                <span>• Mortgage field inspections and occupancy checks</span>\n                <span>• Insurance loss-control and commercial surveys</span>\n                <span>• Property preservation and REO documentation</span>\n                <span>• Independent field-service and verification work</span>\n""",
          )
          replace_once(
              homepage,
              """                  Search firms for &ldquo;Independent Field Inspector near me&rdquo; and &ldquo;Mobile Notary&rdquo; work. No\n                  resumes uploaded. you control who sees your info.\n""",
              """                  Compare firms hiring independent field inspectors, loss-control surveyors, preservation vendors,\n                  and property-data contractors. You control when and where you share your information.\n""",
          )
          replace_once(homepage, 'Find Field Inspection &amp; Appraisal Jobs', 'Find field inspection work that fits your route')
          replace_once(
              homepage,
              'One place to see who is hiring for Mortgage Field Inspection services and Home valuation for mortgage lenders.',
              'One place to compare field-service firms, assignment lanes, coverage, requirements, and route-fit clues.',
          )
          replace_once(homepage, 'Updated 2025 Rates', 'Planning scenarios')
          replace_once(
              homepage,
              """                  Field inspection pay varies wildly by region and service type.\n                  Use our free calculator to see potential weekly revenue based on your\n                  zip code and vehicle type.\n""",
              """                  Field inspection pay varies by region, assignment type, and route density.\n                  Free members can model weekly revenue using their expected volume and average fee.\n""",
          )
          replace_once(homepage, 'Calculate My Income →', 'Open the Free Calculator →')
          replace_once(homepage, '<span>• No signup required</span>', '<span>• Free account required</span>')
          replace_once(homepage, '<span>• Instant results</span>', '<span>• No card required</span>')

          seo = 'apps/web-members/lib/seo.ts'
          replace_once(
              seo,
              "export const SITE_DESCRIPTION = 'The #1 Hub for Mortgage Field Inspection services, Mobile Notary for real estate closings, and Certified residential property appraisals.'",
              "export const SITE_DESCRIPTION = 'The member hub for independent field inspectors to compare hiring firms, understand assignment requirements, build skills, and plan more profitable routes.'",
          )

          layout = 'apps/web-members/app/layout.tsx'
          replace_regex_once(
              layout,
              r"  keywords: \[.*?\n  \],",
              """  keywords: [\n    'Field Inspector Directory',\n    'Mortgage Field Inspection services',\n    'Independent Field Inspector near me',\n    'Insurance Loss Control Inspection',\n    'Property preservation vendors',\n    'Occupancy inspection jobs',\n    'Commercial field inspection',\n    'Property condition reports',\n    'Drive-by property inspection',\n    'Field service contractor jobs',\n    'Field inspection training',\n    'Field inspection jobs',\n  ],""",
          )

          footer = 'apps/web-members/components/SiteFooter.tsx'
          replace_once(
              footer,
              'Compare firms, prep for routes, and get tools that help inspectors, notaries, and real estate pros plan smarter days on the road.',
              'Compare firms, prepare for assignments, and use practical tools that help independent field inspectors plan smarter, more profitable routes.',
          )

          package_json = 'apps/web-members/package.json'
          replace_once(
              package_json,
              '    "audit:free-to-pro": "node ./scripts/audit-free-to-pro-funnel.mjs"\n',
              '    "audit:free-to-pro": "node ./scripts/audit-free-to-pro-funnel.mjs",\n    "audit:tools-positioning": "node ./scripts/audit-tools-positioning.mjs"\n',
          )
          PY

      - name: Install web-members dependencies
        working-directory: apps/web-members
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused access audit
        working-directory: apps/web-members
        run: npm run audit:tools-positioning

      - name: Run lint
        working-directory: apps/web-members
        run: npm run lint

      - name: Run TypeScript check
        working-directory: apps/web-members
        run: npx tsc --noEmit

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated changes
        run: |
          rm .github/workflows/apply-tools-positioning-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align tools access pricing and homepage positioning"
          git push origin HEAD:fix/tools-entitlements-pricing-positioning
