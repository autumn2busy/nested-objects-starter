name: Member Public Surface Boundary

on:
  pull_request:
    paths:
      - 'apps/web-members/**'
      - '.github/workflows/member-public-surfaces.yml'

permissions:
  contents: read

jobs:
  validate-member-public-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install member app dependencies
        working-directory: apps/web-members
        run: npm ci --no-audit --no-fund

      - name: Validate public-surface contracts
        working-directory: apps/web-members
        run: npm run audit:member-surfaces

      - name: Verify signed login handoff and portal protection
        working-directory: apps/web-members
        run: node --test tests/auth-login-return.test.mjs

      - name: Lint and typecheck member app
        working-directory: apps/web-members
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Verify runtime redirects and fail-closed APIs
        working-directory: apps/web-members
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/member-tools-next.log"
          npm run dev -- --hostname localhost --port 3018 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --silent --show-error --fail http://localhost:3018/tools >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 2
          done

          if [[ "$ready" -ne 1 ]]; then
            cat "$log_file"
            exit 1
          fi

          MEMBER_SURFACE_BASE_URL=http://localhost:3018 npm run verify:member-tools-runtime
