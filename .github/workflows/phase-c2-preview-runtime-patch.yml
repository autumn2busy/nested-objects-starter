name: Apply Phase C2 preview runtime patch

on:
  push:
    branches:
      - feature/318-phase-c2-preview-runtime-entrypoint
    paths:
      - '.github/workflows/phase-c2-preview-runtime-patch.yml'

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase C2 branch
        uses: actions/checkout@v4
        with:
          ref: feature/318-phase-c2-preview-runtime-entrypoint
          fetch-depth: 0

      - name: Use Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Apply reviewed Phase C2 files
        run: |
          cat .phase-c2-patch/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/phase-c2-patch.tgz
          echo '9f0789b53b368e351e57309e9f8b625d59c1dbb57d4a6b28a2a1ec9451353606  /tmp/phase-c2-patch.tgz' | sha256sum --check
          tar -xzf /tmp/phase-c2-patch.tgz -C .

      - name: Validate isolated runtime
        working-directory: apps/agent-runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run validate

      - name: Commit Phase C2 preview runtime
        run: |
          rm -rf .phase-c2-patch
          rm .github/workflows/phase-c2-preview-runtime-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Phase C2 preview runtime entry point"
          git push origin HEAD:feature/318-phase-c2-preview-runtime-entrypoint
