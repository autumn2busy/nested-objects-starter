name: Apply Phase C hardening patch

on:
  push:
    branches:
      - feature/318-phase-c-projections-lifecycle-integrity
    paths:
      - '.github/workflows/phase-c-hardening-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase C branch
        uses: actions/checkout@v4
        with:
          ref: feature/318-phase-c-projections-lifecycle-integrity
          fetch-depth: 0

      - name: Use Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Apply reviewed hardening changes
        run: node apps/agent-runtime/scripts/apply-phase-c-hardening.mjs

      - name: Install and validate isolated runtime
        working-directory: apps/agent-runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run validate

      - name: Commit the hardened projection contracts
        run: |
          rm .github/workflows/phase-c-hardening-patch.yml
          rm apps/agent-runtime/scripts/apply-phase-c-hardening.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Phase C projection idempotency"
          git push origin HEAD:feature/318-phase-c-projections-lifecycle-integrity
