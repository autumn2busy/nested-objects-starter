name: Agent Runtime Phase B

on:
  pull_request:
    paths:
      - 'apps/agent-runtime/**'
      - 'supabase/migrations/20260825090000_create_intelligence_os_foundation.sql'
      - 'supabase/validation/20260825_validate_intelligence_os_foundation.sql'
      - 'docs/intelligence-os/phase-b-foundation.md'
      - 'docs/intelligence-os/activecampaign-mcp-governance.md'
      - '.github/workflows/agent-runtime-phase-b.yml'

permissions:
  contents: read

jobs:
  validate-agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install isolated runtime dependencies
        working-directory: apps/agent-runtime
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-package-lock
          path: apps/agent-runtime/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Validate isolated runtime
        working-directory: apps/agent-runtime
        run: npm run validate

      - name: Check patch whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
