name: Agent Runtime Intelligence OS

on:
  pull_request:
    paths:
      - 'apps/agent-runtime/**'
      - 'supabase/migrations/**'
      - 'supabase/validation/**'
      - 'docs/intelligence-os/**'
      - '.github/workflows/agent-runtime-phase-b.yml'

permissions:
  contents: read

jobs:
  validate-agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22.16
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install isolated runtime dependencies
        working-directory: apps/agent-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate isolated runtime
        working-directory: apps/agent-runtime
        run: npm run validate

      - name: Check patch whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
